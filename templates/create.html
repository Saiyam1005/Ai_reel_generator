{% extends "base.html" %}

{% block title %}S-AI{% endblock %}

{% block extra_css %} 
<link rel="stylesheet" href="{{ url_for('static', filename='css/create.css') }}">
{% endblock %}

{% block content %}
<section class="upload-section">
    <div class="container">
        <div class="upload-container">
            <div class="upload-header">
                <span class="eyebrow"><i class="bi bi-cloud-check-fill me-2"></i>Cloud upload</span>
                <h1 class="upload-title">Create Your Reel</h1>
                <p class="upload-instructions">Upload your clips and narration prompt. Media is sent directly to ImageKit.</p>
            </div>
            
            <form action="/create" enctype="multipart/form-data" method="post" class="dropzone" id="myDropzone">
                <div class="fallback">
                    <div id="fileInputs">
                        <div class="file-input-group">
                            <input name="file1" type="file" class="file-input" />
                            <input type="hidden" name="uuid" value="{{ myid }}" />
                            <button type="button" class="remove-file-btn" onclick="removeFileInput(this)" disabled><i class="bi bi-dash-lg"></i></button>
                        </div>
                    </div>
                    <button type="button" class="add-file-btn" onclick="addFileInput()"><i class="bi bi-plus-lg me-2"></i>Add File</button>
                </div>
                
                <div class="text-input-container">
                    <label class="input-label" for="textInput">Narration</label>
                    <textarea class="text-input" id="textInput" name="text" placeholder="Enter the text to turn into voice narration..." rows="4"></textarea>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="bi bi-stars me-2"></i>Create Reel
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    let fileCounter = 2; // Start from 2 since we already have file1

    function addFileInput() {
        const fileInputs = document.getElementById('fileInputs');
        const newFileInput = document.createElement('div');
        newFileInput.className = 'file-input-group';
        newFileInput.innerHTML = `
            <input name="file${fileCounter}" type="file" class="file-input" />
            <button type="button" class="remove-file-btn" onclick="removeFileInput(this)"><i class="bi bi-dash-lg"></i></button>
        `;
        fileInputs.appendChild(newFileInput);
        fileCounter++;
    }

    function removeFileInput(button) {
        const fileInputGroup = button.parentElement;
        fileInputGroup.remove();
    }
</script>
{% endblock %}
